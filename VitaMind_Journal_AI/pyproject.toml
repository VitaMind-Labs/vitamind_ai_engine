[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitamind-journal-ai"
version = "0.1.0"
description = "Standalone English-Arabic journal classification and support policy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
packages = ["journal_ai", "training"]

[tool.setuptools.package-data]
journal_ai = ["models/journal-linear/*.json", "models/journal-linear/*.npz"]

[project.scripts]
journal-sentinel = "journal_ai.cli:main"
