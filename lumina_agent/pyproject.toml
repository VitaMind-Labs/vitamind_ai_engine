[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitamind-lumina"
version = "0.1.0"
description = "Lumina local patient-support intelligence: from-scratch models, no external inference API"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# Only the raw-corpus builders need this; training and inference do not.
data = ["pandas>=2,<3"]

[tool.setuptools.packages.find]
include = ["lumina*", "journal_ai*", "data_prep*", "training*", "evaluation*"]

[tool.setuptools.package-data]
journal_ai = ["models/journal-linear/*.json", "models/journal-linear/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests", "journal_ai/tests"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", "data", "artifacts", "datasets"]
